[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tft-decision"
version = "0.1.0"
description = "Fast, provider-agnostic Teamfight Tactics decision engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
